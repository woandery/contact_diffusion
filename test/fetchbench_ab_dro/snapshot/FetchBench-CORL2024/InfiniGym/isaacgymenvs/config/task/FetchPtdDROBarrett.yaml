name: FetchPtdDROBarrett

defaults:
  - FetchPtdDROBase
  - _self_

env:
  robot:
    type: franka_dro_barrett
    asset_root: ./assets
    urdf_file: urdf/dexterous/franka_dro_barrett.urdf
    arm_dof_count: 7
    hand_name: barrett
    eef_link: bh_base_link
    eef_joint: dex_mount_joint
    contact_links: [bh_finger_33_link, bh_finger_13_link, bh_finger_23_link]
    # Fully extend all three fingers, while placing the two spread fingers at
    # +/-120 degrees around the palm.  The all-zero Barrett pose is also open,
    # but it is the parallel two-versus-one cylindrical configuration and
    # looks unintentionally folded when used as a neutral ready pose.
    # Order: j32, j33, j11(spread), j12, j13, j21(spread), j22, j23.
    hand_default_dof_pos: [0.0, 0.0, 1.0471976, 0.0, 0.0, 1.0471976, 0.0, 0.0]
    hand_joint_gain: 5000.0
    hand_joint_damp: 200.0
    hand_joint_effort: 80.0

solution:
  pyompl:
    robot_urdf: assets/urdf/dexterous/franka_dro_barrett.urdf
    eef_link: bh_base_link
    active_joint_names: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    hand_joint_names: [bh_j32_joint, bh_j33_joint, bh_j11_joint, bh_j12_joint, bh_j13_joint, bh_j21_joint, bh_j22_joint, bh_j23_joint]
  dro:
    pregrasp_direction: [1.0, 0.0, 0.0]
