base_config: contact_ar_success_k128_partialonly_normfull_warmfull64_gb768_64k_4x4090.yaml

dataset:
  # Continue the current partial64k model with equal full/partial exposure.
  # A mixed sample either uses the complete 2048x3 cloud or a fresh random
  # view-facing 50% crop resampled to 2048x3.
  object_observation_mode: mixed_full_synthetic_partial
  partial_probability: 0.5
  synthetic_partial_keep_ratio: 0.5
  partial_normalization_reference: full
  num_points: 2048
  full_geometry_num_points: 2048
  normalize: true
  append_observation_type_feature: false

model:
  # Keep the checkpoint architecture unchanged: XYZ only, no observation flag.
  object_input_dim: 3

train:
  output_dir: outputs/contact_ar_success_k128_mixedfullpartial_normfull_warmpartial64_gb768_64k_4x4090/model
  batch_size: 192
  gradient_accumulation_steps: 1
  max_steps: 64000

  # Half of the original 8e-4 peak: high enough to learn the newly introduced
  # full-cloud half, while reducing the risk of forgetting the partial route.
  lr: 0.0004
  lr_scheduler: cosine
  min_lr_ratio: 0.2

  val_every: 8000
  save_every: 8000
  seed: 20260904

  # Load model parameters from the current partial64k checkpoint, while
  # intentionally starting a fresh optimizer/scheduler for this 64k stage.
  warmstart_model: outputs/contact_ar_success_k128_partialonly_normfull_warmfull64_gb768_64k_4x4090/model/checkpoints/step_00064000.pt
  resume: null
